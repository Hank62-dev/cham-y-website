<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="1000" rx="36" fill="#f0e9dc"/>
  <rect x="24" y="24" width="752" height="952" rx="30" fill="none" stroke="#d9cfbc" stroke-width="2"/>

  <text x="48" y="68" font-size="17" font-weight="700" letter-spacing="2" fill="#3a5a35">MÓN CỦA BẠN</text>
  <text x="752" y="68" font-size="14" font-weight="700" letter-spacing="2" fill="#d14fa5" text-anchor="end">LIVE PREVIEW</text>

  <!-- Branch 3: from the top ring, straight down the right side -->
  <path d="M434 140 H690 V815" fill="none" stroke="#3a5a35" stroke-width="8" stroke-dasharray="14 10"/>

  <!-- ring + main trunk -->
  <circle cx="400" cy="140" r="34" fill="none" stroke="#3a5a35" stroke-width="10"/>
  <circle cx="400" cy="188" r="12" fill="#3a5a35"/>
  <line x1="400" y1="188" x2="400" y2="300" stroke="#3a5a35" stroke-width="8"/>

  <!-- split into branch 1 and 2 -->
  <line x1="256" y1="300" x2="544" y2="300" stroke="#3a5a35" stroke-width="8" stroke-linecap="square"/>
  <line x1="260" y1="300" x2="260" y2="815" stroke="#3a5a35" stroke-width="8"/>
  <line x1="540" y1="300" x2="540" y2="860" stroke="#3a5a35" stroke-width="8"/>

  <!-- pills -->
  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="185" y="340" width="150" height="38" rx="19" fill="#d14fa5"/>
    <text x="260" y="364">Nhánh 1 · Charm</text>
    <rect x="475" y="340" width="130" height="38" rx="19" fill="#d14fa5"/>
    <text x="540" y="364">Nhánh 2 · Chữ</text>
    <rect x="625" y="340" width="130" height="38" rx="19" fill="#d14fa5"/>
    <text x="690" y="364">Nhánh 3 · Dây</text>
  </g>

  <!-- Branch 1: charm slots (1-3) -->
  <g text-anchor="middle" font-size="24" font-weight="700" fill="#3a5a35">
    <circle cx="260" cy="450" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="260" y="459">1</text>
    <circle cx="260" cy="540" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="260" y="549">2</text>
    <circle cx="260" cy="630" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="260" y="639">3</text>
  </g>

  <!-- Branch 2: letter slots (2-5), all empty -->
  <g text-anchor="middle" font-size="24" font-weight="700" fill="#3a5a35">
    <circle cx="540" cy="450" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="540" y="459">1</text>
    <circle cx="540" cy="540" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="540" y="549">2</text>
    <circle cx="540" cy="630" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="540" y="639">3</text>
    <circle cx="540" cy="720" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="540" y="729">4</text>
    <circle cx="540" cy="810" r="32" fill="#f0e9dc" stroke="#3a5a35" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="540" y="819">5</text>
  </g>

  <!-- tassels -->
  <circle cx="260" cy="835" r="17" fill="#3a5a35"/>
  <path d="M260 850 L246 905 M260 850 L260 910 M260 850 L274 905" stroke="#3a5a35" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M540 860 L526 905 M540 860 L540 910 M540 860 L554 905" stroke="#3a5a35" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="690" cy="835" r="17" fill="#3a5a35"/>
  <path d="M690 850 L676 905 M690 850 L690 910 M690 850 L704 905" stroke="#3a5a35" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- limits -->
  <g text-anchor="middle" font-size="14" fill="#3a5a35">
    <text x="260" y="945" font-weight="700">Charm</text>
    <text x="260" y="964" font-size="12">tối thiểu 1 · tối đa 3</text>
    <text x="540" y="945" font-weight="700">Chữ</text>
    <text x="540" y="964" font-size="12">tối thiểu 2 · tối đa 5</text>
    <text x="690" y="945" font-weight="700">Dây phụ</text>
    <text x="690" y="964" font-size="12">đặc biệt</text>
  </g>
</svg>
